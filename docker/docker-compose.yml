services:
  htrflow:
    image: airiksarkivet/htrflow:latest
    container_name: htrflow
    build:
      context: ../
      dockerfile: docker/htrflow.dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    command:
      [
        "/bin/sh",
        "-c",
        "htrflow pipeline pipeline/pipeline.yaml input --logfile logs/htrflow/htrflow.log",
      ]

    volumes:
      - ./examples/images/pages:/app/input 
      - ./output-volume:/app/outputs
      - ./logs-volume:/app/logs
      - ./examples/pipelines:/app/pipeline
      - ./.cache:/app/models