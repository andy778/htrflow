name: Code Quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - qa

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/uv

      - name: Linting check with ruff
        run: uv run ruff check