name: Code Quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - qa

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/uv

      - name: Linting check with ruff
        run: uvx ruff check --fix