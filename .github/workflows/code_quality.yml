name: Code Quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - qa

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/uv

      - name: Linting check with ruff
        run: uvx ruff check --fix