name: Pytest
on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"] 

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -m "not gpu and not openmmlab and not teklia"
