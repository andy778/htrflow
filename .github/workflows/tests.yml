name: Pytest
on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -m "not gpu and not openmmlab and not teklia and not extended"
