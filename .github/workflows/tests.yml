name: Pytest
on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache HF models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ hashFiles('tests/integration/data/pipelines/quickstart_pipeline.yaml') }}
          restore-keys: |
            hf-models-

      - name: Run tests
        run: uv run pytest -m "not gpu and not openmmlab and not teklia and not extended"
