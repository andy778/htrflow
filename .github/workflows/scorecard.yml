name: Security Scorecard

# Runs OpenSSF Scorecard (https://github.com/ossf/scorecard) against this repo
# and commits the results as a plain JSON file under .github/scorecard/. This
# is intentionally kept private: publish_results is false, so nothing is sent
# to the public Scorecard API or badge, and the results aren't linked from any
# public docs. It's informational only — a baseline to track over time, not a
# CI gate. Weekly schedule only takes effect once this workflow exists on the
# repo's default branch; workflow_dispatch always works.

on:
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.json
          results_format: json
          publish_results: false

      - name: Save results to the repo
        run: |
          mkdir -p .github/scorecard
          mv scorecard-results.json .github/scorecard/results.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/scorecard/results.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update security scorecard results"
            git push
          fi
